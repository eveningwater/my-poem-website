# Decap CMS 配置文档
# 官方文档：https://decapcms.org/docs/configuration-options/

# 后端：使用 Git Gateway（配合 Netlify Identity 做鉴权）
backend:
  name: git-gateway
  branch: main

# 媒体文件上传配置
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# 站点语言
locale: "zh-CN"

# 支持中文文件名
slug:
  encoding: "unicode"
  sanitize_replacement: "-"

# 内容集合
collections:
  # ===== 首页 =====
  - name: "index"
    label: "首页"
    files:
      - name: "index"
        label: "首页"
        file: "docs/index.md"
        fields:
          - { name: "title", label: "页面标题", widget: "string" }
          - name: "hero"
            label: "首页横幅"
            widget: "object"
            fields:
              - { name: "title", label: "标题", widget: "string" }
              - { name: "description", label: "描述", widget: "string" }
              - name: "actions"
                label: "操作按钮"
                widget: "list"
                fields:
                  - { name: "text", label: "按钮文字", widget: "string" }
                  - { name: "link", label: "跳转链接", widget: "string" }
          - { name: "body", label: "正文", widget: "markdown", required: false }

  # ===== 旧体诗（folder） =====
  - name: "old-style-poem"
    label: "旧体诗"
    folder: "docs/old-style-poem"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "body", label: "正文", widget: "markdown" }

  # ===== 现代诗（folder） =====
  - name: "modern-poem"
    label: "现代诗"
    folder: "docs/modern-poem"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "body", label: "正文", widget: "markdown" }

  # ===== 旧体词（folder） =====
  - name: "old-style-word"
    label: "旧体词"
    folder: "docs/old-style-word"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "body", label: "正文", widget: "markdown" }

  # ===== 元曲（folder） =====
  - name: "yuan-opera"
    label: "元曲"
    folder: "docs/yuan-opera"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "body", label: "正文", widget: "markdown" }

  # ===== 歌曲（folder） =====
  - name: "song"
    label: "歌曲"
    folder: "docs/song"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "body", label: "正文", widget: "markdown" }

  # ===== 文言文（folder） =====
  - name: "classical-chinese"
    label: "文言文"
    folder: "docs/classical-chinese"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "body", label: "正文", widget: "markdown" }

  # ===== 散文（folder） =====
  - name: "prose"
    label: "散文"
    folder: "docs/prose"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "body", label: "正文", widget: "markdown" }

  # ===== 短篇小说（folder） =====
  - name: "short-novel"
    label: "短篇小说"
    folder: "docs/short-novel"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title", label: "标题", widget: "string" }
      - { name: "body", label: "正文", widget: "markdown" }

  # ===== 短句（file） =====
  - name: "sentence"
    label: "短句"
    files:
      - name: "sentence"
        label: "短句"
        file: "docs/sentence.md"
        fields:
          - { name: "nav", label: "导航名称", widget: "string" }
          - { name: "body", label: "正文", widget: "markdown" }

  # ===== 对联（file） =====
  - name: "couplet"
    label: "对联"
    files:
      - name: "couplet"
        label: "对联"
        file: "docs/couplet.md"
        fields:
          - { name: "nav", label: "导航名称", widget: "string" }
          - { name: "body", label: "正文", widget: "markdown" }

  # ===== 小说设计（file） =====
  - name: "novel-design"
    label: "小说设计"
    files:
      - name: "novel-design"
        label: "小说设计"
        file: "docs/novel-design.md"
        fields:
          - { name: "nav", label: "导航名称", widget: "string" }
          - { name: "body", label: "正文", widget: "markdown" }
